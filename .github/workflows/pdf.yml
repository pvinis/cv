name: pdf

# Rebuilds the PDF whenever cv.md or the build changes, and commits it back so
# the download link always matches what's in the repo.
on:
  push:
    branches: [main]
    paths:
      - cv.md
      - build/**
      - package.json
      - bun.lock
      - .github/workflows/pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - name: Build PDF
        run: bun run pdf --annotate

      - name: Commit if changed
        run: |
          # Stage first: `git diff` alone does not see an untracked file, so a
          # newly created PDF would look unchanged and never get committed.
          git add Pavlos-Vinieratos-CV.pdf
          if git diff --cached --quiet -- Pavlos-Vinieratos-CV.pdf; then
            echo "PDF unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate CV PDF from cv.md"
          git push
